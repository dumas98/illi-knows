name: Send reminder emails

# The free Render server sleeps after 15 idle minutes, so its own timer can't be relied on.
# This wakes it every 10 minutes and asks it to send any reminders that are due.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the API to send due reminders
        env:
          JOBS_API_KEY: ${{ secrets.JOBS_API_KEY }}
          API_URL: https://illi-knows-api.onrender.com
        run: |
          if [ -z "$JOBS_API_KEY" ]; then
            echo "::warning::The JOBS_API_KEY secret isn't set, so no reminders were sent."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST -H "X-Jobs-Key: $JOBS_API_KEY" "$API_URL/api/jobs/reminders"
          echo
